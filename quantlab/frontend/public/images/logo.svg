<svg width="180" height="48" viewBox="0 0 180 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Glowing Hexagon / Sigma Monogram -->
  <defs>
    <linearGradient id="quantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="50%" stop-color="#00d8ff" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <g transform="translate(4, 4)">
    <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="#0f172a" stroke="url(#quantGrad)" stroke-width="2.5" filter="url(#glow)"/>
    <!-- Quant pulse lines -->
    <path d="M12 24 L17 16 L22 28 L28 14" stroke="#00f5a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <text x="52" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#ffffff" letter-spacing="-0.5">QUANT<tspan fill="#00f5a0">LAB</tspan></text>
  <text x="52" y="38" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b" letter-spacing="1.5">INSTITUTIONAL CORE</text>
</svg>
